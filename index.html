<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Bianca's Kitchen</title>
<style>
  :root{
    --bg:#fbf7f3; --card:#fffdfb; --ink:#2f2926; --muted:#7a6f69; --accent:#8a5b47; --accent2:#d9b9a6; --line:#eaded6;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
  header{padding:34px 20px 18px;text-align:center;background:linear-gradient(180deg,#f6ebe4 0%,var(--bg) 100%)}
  h1{margin:0;color:var(--accent);font-family:Georgia,serif;font-size:clamp(34px,7vw,54px);letter-spacing:.2px}
  .subtitle{margin:8px auto 0;max-width:700px;color:var(--muted);font-size:15px}
  .wrap{max-width:980px;margin:0 auto;padding:18px}
  .searchbox{position:sticky;top:0;z-index:5;padding:10px 0 12px;background:rgba(251,247,243,.96);backdrop-filter: blur(6px)}
  input[type=search]{width:100%;padding:15px 18px;border:1px solid var(--line);border-radius:16px;background:#fff;font-size:17px;outline:none;box-shadow:0 5px 18px rgba(82,55,43,.06)}
  input[type=search]:focus{border-color:var(--accent2);box-shadow:0 0 0 3px rgba(217,185,166,.22)}
  .filters{display:flex;gap:8px;overflow:auto;padding:12px 0 4px;scrollbar-width:none}
  .filters::-webkit-scrollbar{display:none}
  button.filter{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:999px;padding:9px 14px;white-space:nowrap;font-size:14px;cursor:pointer}
  button.filter.active{background:var(--accent);color:white;border-color:var(--accent)}
  .count{color:var(--muted);font-size:13px;margin:10px 2px 16px}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(285px,1fr));gap:16px}
  details{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:0;box-shadow:0 8px 22px rgba(80,57,46,.055);overflow:hidden}
  summary{list-style:none;padding:18px;cursor:pointer}
  summary::-webkit-details-marker{display:none}
  .cat{display:inline-block;color:var(--accent);font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin-bottom:6px}
  .title{font-family:Georgia,serif;font-size:22px;margin:0 0 7px;color:#4b362e}
  .yield{font-size:13px;color:var(--muted)}
  .content{border-top:1px solid var(--line);padding:17px 18px 20px}
  h3{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);margin:8px 0}
  ul,ol{padding-left:22px;margin:8px 0 16px}
  li{margin:6px 0;line-height:1.45}
  .note{background:#f5ebe5;border-radius:12px;padding:12px 13px;color:#5e4b42;font-size:14px;line-height:1.45}
  .empty{text-align:center;color:var(--muted);padding:40px 20px;display:none}
  footer{text-align:center;color:var(--muted);font-size:12px;padding:28px 16px 40px}
  @media(max-width:600px){.wrap{padding:12px}.grid{grid-template-columns:1fr}.searchbox{padding-top:6px}}
</style>
</head>
<body>
<header>
  <h1>Bianca's Kitchen</h1>
  <div class="subtitle">Your searchable living cookbook. Search by ingredient, dish, equipment, category, or serving size.</div>
</header>
<div class="wrap">
  <div class="searchbox">
    <input id="search" type="search" placeholder="Search recipes… try ‘pork belly’, ‘Cuckoo’, ‘for 2’" autocomplete="off" />
    <div class="filters" id="filters"></div>
  </div>
  <div class="count" id="count"></div>
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty">No recipes matched that search.</div>
</div>
<footer>Bianca's Kitchen • Living Cookbook</footer>
<script>
const recipes = [
{category:'Chicken',title:'Chinese Salt & Pepper Wings',yield:'10 Costco party wings',ingredients:['10 party wings','Salt and black pepper, to season','Cornstarch, for coating','Neutral oil, for deep frying','Garlic, sliced chile/jalapeño, and green onion for the aromatic finish'],steps:['Pat the wings very dry and season.','Coat thoroughly in cornstarch; shake off excess.','Deep fry until cooked and crisp. For extra crunch, use a second hotter fry.','Quickly stir-fry the aromatics, then toss the hot wings with the salt-and-pepper seasoning.'],note:'Your go-to Chinese-style fried wing format. Do not save cornstarch that has contacted raw chicken.'},
{category:'Chicken',title:'Double-Fried Buffalo Wings',yield:'10 wings',ingredients:['10 chicken wings','1 tsp kosher salt','1 tsp garlic powder','1/2 tsp black pepper','1/2 tsp paprika (optional)','Neutral oil, for frying','Buffalo sauce, enough to coat'],steps:['Season the wings and let them sit while the oil heats.','Fry at 350°F for 10–12 minutes.','Rest 2–3 minutes.','Fry again at 375°F for 1–2 minutes for extra crispness.','Toss immediately with buffalo sauce.'],note:'Deep-fry-only version; no baking required.'},
{category:'Pork',title:'Cuckoo Braised Pork Belly & Eggs',yield:'about 2 lb pork belly',ingredients:['2 lb pork belly, cut into chunks','Hard-boiled eggs','Soy sauce','Sugar','Garlic','Ginger','Water or broth'],steps:['Combine the braising ingredients and pork in the Cuckoo.','Pressure-cook until the pork is tender.','Transfer to a stovetop pot if the sauce needs reducing; the Cuckoo cannot be used open-lid.','Add the eggs to the braising liquid and simmer while reducing until glossy and concentrated.'],note:'No star anise required. If the sauce looks thin after pressure cooking, reduction—not extra pressure time—is the fix.'},
{category:'Pork',title:'Pressure-Cooker Pork Belly Adobo',yield:'small family batch',ingredients:['Pork belly, cut into bite-size pieces','Soy sauce','Vinegar','Garlic','Bay leaves','Black pepper','Water'],steps:['Combine pork, soy sauce, garlic, pepper, bay leaves, and water in the pressure cooker.','Pressure-cook until tender.','Add vinegar without aggressively stirring at first, then finish the sauce on the stovetop if it needs to thicken.'],note:'Adapted for thinner-cut pork belly and a Cuckoo with no open-lid browning mode.'},
{category:'Pork',title:'Pork Sinigang with Yam Leaves',yield:'3–4 servings',ingredients:['1–1 1/4 lb pork','6 cups water','1 tomato','1 onion','Knorr sinigang mix, to taste','Daikon radish','Sitaw/long beans','Yam leaves (talbos)','Green chiles, optional','Fish sauce, to taste'],steps:['Simmer the pork with water, tomato, and onion until tender, about 35–50 minutes.','Season the broth with sinigang mix and fish sauce.','Add the firm vegetables first and cook until nearly tender.','Add sitaw and chiles next.','Add yam leaves last and cook only about 2–3 minutes, until wilted and tender.'],note:'Yam leaves go in at the very end so they do not overcook.'},
{category:'Beef',title:'Beef, Fish Ball & Bok Choy Gravy Stew',yield:'family-style batch',ingredients:['Beef chunks','Fish balls','Baby bok choy','Mushrooms','3–4 garlic cloves','1–2 inches ginger','1–1 1/2 cups chicken broth','2 tbsp soy sauce','1 1/2 tbsp oyster sauce','1 tsp sugar','1 tbsp cornstarch + 2 tbsp water'],steps:['Add beef, garlic, ginger, broth, soy sauce, oyster sauce, and sugar to the Cuckoo.','Cook on Meat mode for 25–30 minutes; natural release for 10 minutes.','Transfer to the stovetop and reduce 5–10 minutes.','Add mushrooms and fish balls; cook 5–7 minutes.','Add bok choy; cook 2–3 minutes.','Stir in cornstarch slurry until the gravy reaches the thickness you like.'],note:'Built specifically around your Cuckoo’s closed-lid limitation; the gravy finish happens on the stove.'},
{category:'Noodles & Rice',title:'Dry Garlic-Soy Beef Udon',yield:'2 servings',ingredients:['2 udon packs','1/2 lb thinly sliced beef','6–8 fish balls','2–3 bok choy','3 garlic cloves','2 tbsp neutral oil','2 tbsp soy sauce','1 tbsp oyster sauce','1 tsp sesame oil','1 tsp sugar','2 tbsp water','Dark soy sauce or chili crisp, optional'],steps:['Boil the udon just enough to loosen; drain and rinse.','Mix soy sauce, oyster sauce, sesame oil, sugar, water, and optional dark soy/chili crisp.','Stir-fry garlic and beef, then add fish balls and bok choy.','Add udon and sauce; toss over heat for 2–3 minutes until glossy and well coated.'],note:'The dry, saucy version rather than udon soup.'},
{category:'Noodles & Rice',title:'Shrimp Chili Crunch Noodles',yield:'4 servings',ingredients:['16 oz noodles','4–6 tbsp Costco Shrimp Chili Crunch','6 garlic cloves','1/4 cup soy sauce','2 tbsp oyster sauce','2 tsp sugar or honey','2 tsp rice vinegar','3–5 tbsp noodle water','3–4 cups frozen bok choy'],steps:['Pan-fry frozen bok choy over medium-high heat for 5–7 minutes; remove and reserve.','Cook noodles and reserve some noodle water.','Cook garlic briefly, then add shrimp chili crunch.','Add soy sauce, oyster sauce, sugar/honey, vinegar, and noodle water.','Toss in noodles, then return bok choy and coat everything in the sauce.'],note:'Easy 4-serving version using the Costco shrimp chili crunch.'},
{category:'Noodles & Rice',title:'Shrimp Chili Crunch Fried Rice',yield:'4 servings',ingredients:['6 cups cold cooked rice','3–4 tbsp shrimp chili crunch','5 garlic cloves','3 eggs','3 tbsp soy sauce','1 tbsp oyster sauce','1 tsp sugar','4 green onions','2 tbsp neutral oil'],steps:['Scramble the eggs and remove from the pan.','Fry garlic and chili crunch briefly in oil.','Add cold rice and stir-fry 5–7 minutes, breaking up clumps.','Add soy sauce, oyster sauce, and sugar.','Return eggs and add green onions; toss until evenly seasoned.'],note:'Best with cold rice so the grains stay separate.'},
{category:'Seafood',title:'Ponzu-Unagi Ahi Poke',yield:'2 servings',ingredients:['Sushi-grade ahi tuna, cubed','Ponzu','Unagi sauce','Green onion','Sesame oil, a small amount','Sesame seeds'],steps:['Keep the tuna cold and cube it shortly before serving.','Mix ponzu with a smaller amount of unagi sauce so it is savory, bright, and lightly sweet.','Fold the sauce through the tuna with green onion, sesame oil, and sesame seeds.','Chill briefly or serve immediately over rice.'],note:'One of your non-mayo poke versions.'},
{category:'Seafood',title:'Creamy Kewpie Ahi Poke',yield:'2 servings',ingredients:['Sushi-grade ahi tuna, cubed','Kewpie mayonnaise','Ponzu','Unagi sauce, a small drizzle','Green onion','Sesame seeds','Chili sauce or chili crisp, optional'],steps:['Whisk Kewpie with ponzu and a little unagi sauce.','Fold gently into cold cubed tuna.','Add green onion, sesame seeds, and optional heat.','Serve immediately or keep well chilled until serving.'],note:'Creamier companion to the ponzu-unagi poke.'},
{category:'Appetizers',title:'Crispy Crab Rice-Paper Wontons',yield:'2 servings',ingredients:['Imitation crab sticks, shredded','Fryable rice paper wrappers','Green onion','Seasonings to taste','Neutral oil, for frying'],steps:['Mix the shredded imitation crab with green onion and seasonings; no cream cheese.','Soften/prepare the fryable rice paper as required, then wrap small portions tightly.','Fry until crisp and golden; drain well.','Serve hot with your preferred dipping sauce.'],note:'Specifically made without cream cheese.'},
{category:'Desserts',title:'Mango Sticky Rice – Party Batch',yield:'about 25 servings',ingredients:['6 cups glutinous/sticky/mochi rice','6 cups coconut milk','2–2 1/4 cups sugar','3 tsp salt','10–12 ripe mangoes','Topping: 2 cups coconut milk','2 tbsp sugar','Pinch of salt','2 tsp tapioca starch + 2 tbsp cold water'],steps:['Soak the sticky rice 4–6 hours or overnight.','Steam or cook the soaked rice until tender; for the Cuckoo, split into 2 manageable batches if needed.','Warm 6 cups coconut milk with 2–2 1/4 cups sugar and 3 tsp salt. It should taste a little sweeter than the final rice.','Mix the hot cooked rice with the coconut mixture and rest about 20 minutes to absorb.','For the topping, warm 2 cups coconut milk with 2 tbsp sugar and a pinch of salt. Stir in the tapioca slurry and cook until lightly thickened.','Serve sticky rice with sliced mango and coconut topping.'],note:'Your updated version: the coconut milk amount was good, but the main mixture needed more sugar than the original 1 1/2 cups.'},
{category:'Desserts',title:'French Macarons – Working Notes',yield:'test batch',ingredients:['Almond flour','Powdered sugar','Egg whites','Granulated sugar','Filling of choice'],steps:['Make a French meringue and fold in the dry ingredients until batter reaches the figure-8 stage.','Pipe evenly and rest until the shells are dry to the touch; successful batches sometimes benefited from a longer rest.','Bake in your electric oven around 300°F for about 14 minutes, adjusting rack position as needed.','Cool completely before removing and filling.'],note:'Rainy/humid weather can extend drying time. A lower rack previously contributed to cracking/no feet. Use shell dryness—not a fixed timer—as the cue.'}
];
const grid=document.getElementById('grid'), search=document.getElementById('search'), filters=document.getElementById('filters'), count=document.getElementById('count'), empty=document.getElementById('empty');
let active='All';
const cats=['All',...new Set(recipes.map(r=>r.category))];
for(const c of cats){const b=document.createElement('button');b.className='filter'+(c==='All'?' active':'');b.textContent=c;b.onclick=()=>{active=c;document.querySelectorAll('.filter').forEach(x=>x.classList.toggle('active',x.textContent===c));render();};filters.appendChild(b)}
function esc(s){return s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function matches(r,q){const hay=[r.category,r.title,r.yield,...r.ingredients,...r.steps,r.note].join(' ').toLowerCase();return hay.includes(q)}
function render(){const q=search.value.trim().toLowerCase(); const rows=recipes.filter(r=>(active==='All'||r.category===active)&&(!q||matches(r,q)));grid.innerHTML='';
 for(const r of rows){const d=document.createElement('details');d.innerHTML=`<summary><span class="cat">${esc(r.category)}</span><div class="title">${esc(r.title)}</div><div class="yield">${esc(r.yield)}</div></summary><div class="content"><h3>Ingredients</h3><ul>${r.ingredients.map(x=>`<li>${esc(x)}</li>`).join('')}</ul><h3>Method</h3><ol>${r.steps.map(x=>`<li>${esc(x)}</li>`).join('')}</ol><div class="note"><strong>Bianca's Note:</strong> ${esc(r.note)}</div></div>`;grid.appendChild(d)}
 count.textContent=`${rows.length} recipe${rows.length===1?'':'s'}`;empty.style.display=rows.length?'none':'block';}
search.addEventListener('input',render);render();
</script>
</body>
</html>
